server {
    listen 80;
    server_name dolina-coffee.ru _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip для статики
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # SPA: любой маршрут отдаём в index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Хешированные ассеты — кэшируем надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML и манифест не кэшируем (чтобы обновления доезжали)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }
}
